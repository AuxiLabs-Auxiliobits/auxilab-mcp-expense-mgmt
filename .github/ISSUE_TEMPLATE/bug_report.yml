name: Bug report
description: Something behaves differently than documented
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not report security vulnerabilities here.** Use a
        [private security advisory](https://github.com/Parteek-git2813/expense-management-mcp-server/security/advisories/new)
        instead — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
      placeholder: |
        I ran the policy checker on a $40 meal with a receipt attached and expected it to
        pass, but it reported RECEIPT_REQUIRED.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        The smallest thing that shows the problem. A short Python snippet is ideal — the
        tools have no setup, so a reproduction is usually five lines.
      render: python
      placeholder: |
        from datetime import date
        from decimal import Decimal
        from compliance_tools import check_policy, load_policy
        from compliance_tools.schemas import Category, LineItemInput

        item = LineItemInput(
            employee_id="emp-001",
            category=Category.MEALS_ENTERTAINMENT,
            amount=Decimal("40.00"),
            merchant="Noodle House",
            expense_date=date.today(),
            has_receipt=True,
        )
        print(check_policy(item, load_policy()))
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part?
      multiple: true
      options:
        - Policy Checker
        - Receipt Parser
        - Category Classifier
        - Duplicate Detector
        - Report Summariser
        - MCP server (mcp_server.py)
        - Browser demo (app.py)
        - Terminal demo (cli.py)
        - Database (local_db)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Release tag or commit SHA. `python -c \"import compliance_tools; print(compliance_tools.__version__)\"`"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: "`python --version`"
      placeholder: "3.12.10"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Traceback or output
      description: Paste the full traceback if there is one. No formatting needed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported
          required: true
        - label: I am on a supported Python version (3.11, 3.12 or 3.13)
          required: true
        - label: This is not a security vulnerability (those go through a private advisory)
          required: true
