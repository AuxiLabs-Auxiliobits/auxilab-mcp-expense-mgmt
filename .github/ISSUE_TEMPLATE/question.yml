name: Question
description: Ask how something works, or why it works that way
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Ask away. If the answer turns out to be in the docs but you could not find it,
        that is a documentation bug and we would rather fix it than close the issue —
        please say so.

        Quick pointers:

        - **How do I use it?** → [README.md](../blob/mcp-mavericks/README.md)
        - **Why is it built this way?** → [ARCHITECTURE.md](../blob/mcp-mavericks/ARCHITECTURE.md)
        - **How do I contribute?** → [CONTRIBUTING.md](../blob/mcp-mavericks/CONTRIBUTING.md)
        - **How do I deploy the enterprise version?** → [DEPLOYMENT.md](../blob/mcp-mavericks/DEPLOYMENT.md)

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What are you trying to do?
      description: The underlying goal often has a shorter answer than the question asked.

  - type: dropdown
    id: area
    attributes:
      label: Topic
      options:
        - Using the five tools
        - MCP server / connecting an agent
        - Writing a custom policy
        - Bringing my own model
        - The local database
        - The browser or terminal demo
        - Architecture and design decisions
        - Contributing
        - The archived enterprise version
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the README and ARCHITECTURE.md
          required: true
