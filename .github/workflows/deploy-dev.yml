name: Deploy (dev)

# Manual trigger so infra/app changes are deployed deliberately, not on every push.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   AZURE_CLIENT_ID        — app/SP client id federated for OIDC login (no stored secret)
#   AZURE_TENANT_ID        — Entra tenant id
#   AZURE_SUBSCRIPTION_ID  — target subscription id
#   PG_ADMIN_PASSWORD      — PostgreSQL admin password (passed to the Bicep deploy)
#
# The federated identity above needs Contributor (or scoped equivalent) on the
# expmgmt-dev-rg resource group plus AcrPush on the expmgmtdevacr registry.
on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federated login to Azure — no stored secrets
  contents: read

env:
  RESOURCE_GROUP: expmgmt-dev-rg
  LOCATION: centralindia
  ACR: expmgmtdevacr
  API_APP: expmgmt-dev-api
  WORKER_FINANCE_APP: expmgmt-dev-worker-finance
  WORKER_INGESTION_APP: expmgmt-dev-worker-ingestion
  MIGRATE_JOB: expmgmt-dev-migrate

jobs:
  infra:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment sub what-if \
            --location "$LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/main.dev.bicepparam \
            --parameters pgAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}"
      - name: Deploy
        run: |
          az deployment sub create \
            --location "$LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/main.dev.bicepparam \
            --parameters pgAdminPassword="${{ secrets.PG_ADMIN_PASSWORD }}"

  api-image:
    name: Build & push API image
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR build (image built in Azure, no local Docker needed)
        run: |
          az acr build \
            --registry "$ACR" \
            --image expense-api:${{ github.sha }} \
            --file api/Dockerfile api

  worker-image:
    name: Build & push worker image
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR build (worker image built in Azure)
        run: |
          az acr build \
            --registry "$ACR" \
            --image expense-worker:${{ github.sha }} \
            --file workers/Dockerfile workers

  migrate:
    name: Run DB migrations (alembic upgrade head)
    needs: api-image
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Point the migrate job at the freshly built API image, then run it to completion.
      - name: Update migrate job image
        run: |
          az containerapp job update \
            --name "$MIGRATE_JOB" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR}.azurecr.io/expense-api:${{ github.sha }}"
      - name: Start migration and wait for success
        run: |
          set -euo pipefail
          exec_name=$(az containerapp job start \
            --name "$MIGRATE_JOB" --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)
          echo "Started migration execution: $exec_name"
          for i in $(seq 1 40); do
            status=$(az containerapp job execution show \
              --name "$MIGRATE_JOB" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$exec_name" \
              --query properties.status -o tsv 2>/dev/null || echo "Unknown")
            echo "[$i] migration status: $status"
            case "$status" in
              Succeeded) echo "Migration succeeded."; exit 0 ;;
              Failed|Degraded) echo "Migration failed."; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for migration."; exit 1

  deploy-apps:
    name: Roll Container Apps to the freshly built images
    needs: [migrate, worker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update API container app
        run: |
          az containerapp update \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR}.azurecr.io/expense-api:${{ github.sha }}"
      - name: Update finance worker container app
        run: |
          az containerapp update \
            --name "$WORKER_FINANCE_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR}.azurecr.io/expense-worker:${{ github.sha }}"
      - name: Update ingestion worker container app
        run: |
          az containerapp update \
            --name "$WORKER_INGESTION_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR}.azurecr.io/expense-worker:${{ github.sha }}"
