[project]
name = "expense-mgmt-api"
version = "0.1.0"
description = "FastAPI web API — RBAC, agency-scoped workflow, pluggable auth, audit log"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # multipart/form-data for policy-doc uploads
    # The engine is a local workspace package (installed editable: pip install -e ../core-engine).
    "expense-core>=0.1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Blob (policy uploads) + Service Bus (ingestion enqueue) via Managed Identity.
azure = ["azure-identity>=1.17", "azure-storage-blob>=12.20", "azure-servicebus>=7.12"]
# Document Intelligence (prebuilt-receipt OCR at intake reconciliation, SCOPING §6.1, §7).
docintel = ["azure-ai-documentintelligence>=1.0"]
# HEIC → JPEG receipt conversion (SCOPING §6.1).
images = ["pillow>=10.3", "pillow-heif>=0.16"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `alembic/` is migrations, not importable package code — only ship `app`.
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
# Make both the API app and the local engine importable without installation in CI.
pythonpath = [".", "../core-engine/src"]
