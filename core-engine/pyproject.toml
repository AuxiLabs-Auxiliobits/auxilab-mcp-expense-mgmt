[project]
name = "expense-core"
version = "0.1.0"
description = "Pure-Python expense compliance engine — the 5 tools, schemas, baseline policy. Zero web/framework imports."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Real Azure LLM access. Without these, the engine still runs using the local
# deterministic provider (see expense_core.llm.providers.LocalEchoProvider).
azure = [
    "openai>=1.40",
    "azure-identity>=1.17",
]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
