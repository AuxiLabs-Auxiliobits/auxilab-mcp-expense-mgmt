# Local dev dependencies (SCOPING §12 — "PostgreSQL in Docker"). The API runs against
# SQLite out of the box; bring these up only when you want a Postgres/Redis parity setup.
#
#   docker compose up -d
#   export APP_DATABASE_URL=postgresql+psycopg://expense:expense@localhost:5432/expense
#
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
