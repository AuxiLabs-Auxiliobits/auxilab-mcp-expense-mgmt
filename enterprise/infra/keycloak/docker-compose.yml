# Local OIDC identity provider — a stand-in for Microsoft Entra ID.
# The Authorization-Code + PKCE + refresh flow is identical to Entra; only the issuer
# and client id differ, so the same app code (APP_AUTH_PROVIDER=oidc) works against both.
#
#   docker compose -f infra/keycloak/docker-compose.yml up -d
#   Admin console: http://localhost:8080  (admin / admin)
#   Issuer:        http://localhost:8080/realms/auxilab
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm-auxilab.json:/opt/keycloak/data/import/realm-auxilab.json:ro
