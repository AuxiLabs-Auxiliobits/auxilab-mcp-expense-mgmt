[project]
name = "auxilab-mcp-expense-mgmt"
version = "0.1.0"
description = "MCP server exposing the five expense-management tools (SCOPING §4, §11). Stateless wrapper over expense-core."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    # The framework-free engine (SCOPING §4). Installed as a sibling editable
    # package: from the monorepo root run `pip install -e ./core-engine` first,
    # or `pip install -e ./mcp-server` after, so `expense_core` resolves.
    "expense-core>=0.1.0",
    "pydantic>=2.7",
    # HTTP client for the authenticated business tools that call the FastAPI backend.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Real Azure AI Foundry access flows through expense-core's [azure] extra; the
# server runs fully offline without it (see expense_core.llm.LocalEchoProvider).
azure = ["expense-core[azure]>=0.1.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
# Launches the stdio MCP server (SCOPING §11).
auxilab-mcp-expense-mgmt = "expense_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
