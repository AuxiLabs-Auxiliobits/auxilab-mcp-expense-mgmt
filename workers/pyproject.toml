[project]
name = "expense-workers"
version = "0.1.0"
description = "LangGraph LLM Finance Approver + Service Bus consumers + agency-scoped RAG (SCOPING §4, §6.3, §7, §11)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "expense-core",
]

[project.optional-dependencies]
# Real Azure access. Without these the package still imports and the `demo`/tests
# run using in-memory fallbacks (InMemoryRetriever, NoopShield, LocalEchoProvider).
azure = [
    "azure-servicebus>=7.12",
    "azure-search-documents>=11.5",
    "azure-ai-inference>=1.0.0b4",
    "azure-identity>=1.17",
    "azure-ai-contentsafety>=1.0",
    "azure-ai-documentintelligence>=1.0",  # policy-doc extraction (ingestion)
    "azure-storage-blob>=12.20",           # download uploaded policy docs (ingestion)
    "httpx>=0.27",                         # callback to the API after indexing
]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers"]

# Local monorepo wiring: resolve expense-core from the sibling package.
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
expense-core = { path = "../core-engine", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src", "../core-engine/src"]
